[project]
name = "crypto-prism-ops"
version = "0.1.0"
description = "End to End MLOps Pipeline for Crypto Price Forecasting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "feast[redis]",
    "pandas",
    "yfinance",
    "torch",
    "python-dotenv",
    "absl-py>=2.3.1",
    "portalocker>=3.2.0",
    "scikit-learn>=1.8.0",
    "dagshub>=0.6.4",
    "mlflow>=3.8.1",
    "redis>=4.6.0",
    "qdrant-client>=1.7.0",
    "streamlit>=1.54.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "numpy>=2.4.1",
    "matplotlib>=3.10.8",
    "fastapi>=0.128.0",
    "uvicorn>=0.34.0",
    "aiofiles>=25.1.0",
    "psutil>=7.2.1",
    "langgraph>=1.0.10",
    "langchain>=1.2.10",
    "langchain-ollama>=1.0.1",
    "langchain-community>=0.4.1",
    "dnspython>=2.8.0",
    "requests>=2.32.5",
    "langchain-google-genai>=4.2.1",
    "plotly>=6.6.0",
    "timesfm>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "logger"]
